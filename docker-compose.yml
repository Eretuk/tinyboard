services:
  tinyboard:
    image: ghcr.io/eretuk/tinyboard:latest
    # To build locally instead:
    # build: .
    container_name: tinyboard
    restart: unless-stopped
    # Container runs as UID/GID 10001 (non-root, matches Dockerfile).
    # Before first start, create the data directory with correct ownership:
    #   mkdir -p data && sudo chown -R 10001:10001 data/
    user: "10001:10001"
    ports:
      - "8849:8849"
    volumes:
      # Persistent storage for config.yaml, board.yaml and the redb uptime database.
      # The directory must be owned by UID 10001 (see above).
      - ./data:/data/tinyboard
    environment:
      - TZ=Europe/Warsaw
      # Log level — uses standard RUST_LOG syntax:
      #   info     — normal operation (default)
      #   debug    — verbose, includes per-request traces
      #   warn     — warnings and errors only
      - RUST_LOG=info
      # Optional: override any config.yaml value via environment variables
      # - HOST=0.0.0.0
      # - PORT=8849
      # - THEME=minty
      # - COLOR=auto
      # - BTNWIDTH=180px
      # - WEBREFRESH=60
      # - SCAN_INTERVAL=60
      # - DBTRIMDAYS=30
