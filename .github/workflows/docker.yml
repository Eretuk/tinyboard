name: Build Docker image

on:
  push:
    branches:
      - develop        # dev build on every push to develop
    tags:
      - 'v*'           # release build on version tag
  workflow_dispatch:   # manual trigger from GitHub UI

jobs:
  # compute lowercase image name (ghcr.io requires lowercase)
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - id: name
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')/tinyboard" >> $GITHUB_OUTPUT

  # ── Dev build (develop branch) ──────────────────────────────────────
  build-dev:
    needs: prepare
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ needs.prepare.outputs.image }}:dev
            ${{ needs.prepare.outputs.image }}:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Release build (version tag) ─────────────────────────────────────
  build-release:
    needs: prepare
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push release image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ needs.prepare.outputs.image }}:latest
            ${{ needs.prepare.outputs.image }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
